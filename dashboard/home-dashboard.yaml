{
  "button_card_templates": {
    "entity_button": {
      "extra_styles": "@keyframes mymove {\n  30% {box-shadow: 0 0 20px white;}\n  }\n",
      "hold_action": {
        "action": "more-info"
      },
      "icon": "[[[ return variables.icon ]]]",
      "state": [
        {
          "icon": "[[[ return variables.icon ]]]",
          "styles": {
            "card": [
              {
                "height": "80px"
              }
            ],
            "icon": [
              {
                "width": "50%"
              },
              {
                "opacity": 0.5
              }
            ],
            "name": [
              {
                "padding": "5px 0px"
              },
              {
                "font-size": "15px"
              }
            ]
          },
          "value": "off"
        },
        {
          "color": "white",
          "icon": "[[[ return variables.icon ]]]",
          "operator": "default",
          "styles": {
            "card": [
              {
                "height": "80px"
              },
              {
                "animation": "mymove 10s infinite"
              }
            ],
            "icon": [
              {
                "width": "50%"
              },
              {
                "color": "green"
              }
            ],
            "name": [
              {
                "padding": "5px 0px"
              },
              {
                "font-size": "15px"
              }
            ]
          }
        }
      ],
      "variables": {
        "icon": "icon"
      }
    },
    "fan_button": {
      "hold_action": {
        "action": "more-info"
      },
      "icon": "mdi:fan",
      "state": [
        {
          "icon": "mdi:fan",
          "styles": {
            "card": [
              {
                "height": "80px"
              }
            ],
            "icon": [
              {
                "width": "50%"
              },
              {
                "opacity": 0.5
              }
            ],
            "name": [
              {
                "font-size": "15px"
              }
            ]
          },
          "value": "off"
        },
        {
          "color": "white",
          "icon": "mdi:fan",
          "operator": "default",
          "styles": {
            "card": [
              {
                "height": "80px"
              }
            ],
            "icon": [
              {
                "width": "50%"
              },
              {
                "color": "green"
              },
