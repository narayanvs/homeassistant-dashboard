button_card_templates:
  entity_button:
    extra_styles: "@keyframes mymove {\n  30% {box-shadow: 0 0 20px white;}\n  }\n"
    hold_action:
      action: more-info
    icon: '[[[ return variables.icon ]]]'
    state:
    - icon: '[[[ return variables.icon ]]]'
      styles:
        card:
        - height: 80px
        icon:
        - width: 50%
        - opacity: 0.5
        name:
        - padding: 5px 0px
        - font-size: 15px
      value: 'off'
    - color: white
      icon: '[[[ return variables.icon ]]]'
      operator: default
      styles:
        card:
        - height: 80px
        - animation: mymove 10s infinite
        icon:
        - width: 50%
        - color: green
        name:
        - padding: 5px 0px
        - font-size: 15px
    variables:
      icon: icon
  fan_button:
    hold_action:
      action: more-info
    icon: mdi:fan
    state:
    - icon: mdi:fan
      styles:
        card:
        - height: 80px
        icon:
        - width: 50%
        - opacity: 0.5
        name:
        - font-size: 15px
      value: 'off'
    - color: white
      icon: mdi:fan
      operator: default
      styles:
        card:
        - height: 80px
        icon:
        - width: 50%
        - color: green
        - animation: rotating 2s linear infinite
        name:
        - font-size: 15px
    variables:
      icon: icon
  group_button:
    show_name: true
    state:
    - icon: '[[[ return variables.icon ]]]'
      styles:
        card:
        - height: 100px
        icon:
        - width: 30%
        - opacity: 0.5
        name:
        - font-size: 15px
        - opacity: 0.5
      value: 'off'
    - color: white
      icon: '[[[ return variables.icon ]]]'
      operator: default
      styles:
        card:
        - height: 100px
        icon:
        - width: 30%
        name:
        - font-size: 15px
    variables:
      icon: icon
  security_button:
    icon: '[[[ return variables.icon_1 ]]]'
    state:
    - icon: '[[[ return variables.icon_1 ]]]'
      styles:
        icon:
        - width: 45%
        - opacity: 0.5
        name:
        - padding: 10px
        - font-size: 12px
      value: '[[[ return variables.value ]]]'
    - color: white
      icon: '[[[ return variables.icon_2 ]]]'
      operator: default
      styles:
        icon:
        - width: 45%
        - color: rgba(255, 0, 0, 0.6)
        name:
        - color: red
        - font-weight: bold
        - font-size: 12px
    variables:
      icon_1: icon_1
      icon_2: icon_2
      value: value
swipe_nav:
  animate: swipe
  prevent_default: true
  swipe_amount: 30
  wrap: false
title: Myhome
views:
- title: Home
  path: home
  icon: mdi:home
  cards: []
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: custom:myhome-floating-nav-v23
      active: home
      grid_options:
        columns: full
        rows: auto
      dashboard: dashboard-mobile
      view: home
    - card_mod:
        style: "ha-card {\n  background: transparent !important;\n  border: none !important;\n  box-shadow: none !important;\n\
          \  padding: 0 !important;\n}\n"
      type: vertical-stack
      cards:
      - type: horizontal-stack
        cards:
        - alignment: center
          type: custom:mushroom-chips-card
          chips:
          - content_info: name
            entity: alarm_control_panel.naranvs2001_gmail_com
            name: Alarm
            type: alarm-control-panel
          - content: Lock
            entity: lock.front_front_door
            hold_action:
              action: navigate
              navigation_path: security
            icon: '{% if is_state(''lock.front_front_door'', ''unlocked'') %}mdi:lock-open-alert{% elif is_state(''lock.front_front_door'',
              ''locked'') %}mdi:lock{% else %}mdi:lock-question{% endif %}'
            icon_color: '{% if is_state(''lock.front_front_door'', ''unlocked'') %}red{% elif is_state(''lock.front_front_door'',
              ''locked'') %}green{% else %}amber{% endif %}'
            tap_action:
              action: more-info
            type: template
          - type: template
            content: '{% set doors=[''binary_sensor.frontdoor_door'',''binary_sensor.livingroom_door_door'',''binary_sensor.kitchen_door_door_2'']
              %}{% set n=doors|select(''is_state'',''on'')|list|count %}{{ n }} Open'
            entity: binary_sensor.frontdoor_door
            icon: '{% set doors=[''binary_sensor.frontdoor_door'',''binary_sensor.livingroom_door_door'',''binary_sensor.kitchen_door_door_2'']
              %}{{ ''mdi:door-open'' if doors|select(''is_state'',''on'')|list|count>0 else ''mdi:door-closed'' }}'
            icon_color: '{% set doors=[''binary_sensor.frontdoor_door'',''binary_sensor.livingroom_door_door'',''binary_sensor.kitchen_door_door_2'']
              %}{{ ''red'' if doors|select(''is_state'',''on'')|list|count>0 else ''green'' }}'
            tap_action:
              action: navigate
              navigation_path: security
          - content: '{{ [''switch.kitchen_kitchen_1'',''switch.kitchen_kitchen_2'',''switch.dining_dining_1'',''switch.dining_dining_2'',''light.kitchen_corner'',''switch.living_room_living_1'',''switch.living_room_living_2'',''switch.hallway_hallway'',''switch.hallway_entrance'',''switch.ground_toilet'',''light.toilet'',''switch.bedroom_1'',''switch.bedroom_2'',''switch.bedroom_3'',''light.master_bedroom'',''light.guest_bedroom'',''light.kids_bedroom'',''switch.office'',''light.office'',''switch.upstairs_hallway_switch_1'',''switch.ensuite_ensuite_1'',''switch.ensuite_ensuite_2'',''switch.shower_shower_1'',''switch.shower_shower_2'',''switch.attic_light'',''light.attic'',''switch.upstairs_store'',''light.upstairs_store'',''switch.hallway_store'',''light.hallway_store'',''switch.kitchen_store'',''switch.kitchen_garden'']
              | select(''is_state'',''on'') | list | count }} Lights'
            icon: mdi:lightbulb-group
            icon_color: '{% if ([''switch.kitchen_kitchen_1'',''switch.kitchen_kitchen_2'',''switch.dining_dining_1'',''switch.dining_dining_2'',''light.kitchen_corner'',''switch.living_room_living_1'',''switch.living_room_living_2'',''switch.hallway_hallway'',''switch.hallway_entrance'',''switch.ground_toilet'',''light.toilet'',''switch.bedroom_1'',''switch.bedroom_2'',''switch.bedroom_3'',''light.master_bedroom'',''light.guest_bedroom'',''light.kids_bedroom'',''switch.office'',''light.office'',''switch.upstairs_hallway_switch_1'',''switch.ensuite_ensuite_1'',''switch.ensuite_ensuite_2'',''switch.shower_shower_1'',''switch.shower_shower_2'',''switch.attic_light'',''light.attic'',''switch.upstairs_store'',''light.upstairs_store'',''switch.hallway_store'',''light.hallway_store'',''switch.kitchen_store'',''switch.kitchen_garden'']
              | select(''is_state'',''on'') | list | count) > 0 %}amber{% else %}grey{% endif %}'
            tap_action:
              action: navigate
              navigation_path: /dashboard-mobile/lights_on
            type: template
            hold_action:
              action: navigate
              navigation_path: /dashboard-mobile/lights
          card_mod:
            style: 'ha-card { --chip-background: transparent; --chip-border-width: 0; --chip-box-shadow: none; --chip-spacing:
              8px; }'
      - type: custom:myhome-quiet-live-v27
        grid_options:
          columns: full
          rows: auto
      - type: custom:myhome-live-destinations-v22
      - type: horizontal-stack
        cards:
        - type: custom:mushroom-template-card
          entity: person.resident_1
          primary: Resident 1
          secondary: '{% set s=states(''person.resident_1'') %}{{ ''Home'' if s==''home'' else (''Away'' if s==''not_home''
            else s|replace(''_'','' '')|title) }}'
          picture: /local/myhome-scene-v1/resident-1-avatar-v1.svg
          badge_icon: '{{ ''mdi:home'' if is_state(''person.resident_1'',''home'') else ''mdi:walk'' }}'
          badge_color: '{{ ''green'' if is_state(''person.resident_1'',''home'') else ''orange'' }}'
          fill_container: true
          tap_action:
            action: more-info
          card_mod:
            style: 'ha-card { background: linear-gradient(110deg, color-mix(in srgb, var(--card-background-color) 45%, transparent),
              transparent) !important; border: none !important; border-radius: 20px !important; box-shadow: none !important;
              }'
          layout: horizontal
        - type: custom:mushroom-template-card
          entity: binary_sensor.resident_2_home_combined
          primary: Resident 2
          secondary: '{{ ''Home'' if is_state(''binary_sensor.resident_2_home_combined'',''on'') else ''Away'' }}'
          picture: /local/myhome-scene-v1/resident-2-avatar-v1.svg
          icon: mdi:account
          icon_color: '{{ ''green'' if is_state(''binary_sensor.resident_2_home_combined'',''on'') else ''grey'' }}'
          badge_icon: '{{ ''mdi:home'' if is_state(''binary_sensor.resident_2_home_combined'',''on'') else ''mdi:walk'' }}'
          badge_color: '{{ ''green'' if is_state(''binary_sensor.resident_2_home_combined'',''on'') else ''orange'' }}'
          fill_container: true
          tap_action:
            action: more-info
            entity: person.resident_2
          card_mod:
            style: 'ha-card { background: linear-gradient(110deg, color-mix(in srgb, var(--card-background-color) 45%, transparent),
              transparent) !important; border: none !important; border-radius: 20px !important; box-shadow: none !important;
              }'
          layout: horizontal
        - type: custom:mushroom-template-card
          entity: device_tracker.parking_tesla_my_location
          primary: Tesla
          secondary: '{% set s=states(''device_tracker.parking_tesla_my_location'') %}{% if s in [''unknown'',''unavailable'',''none'','''']
            or not is_state(''binary_sensor.parking_tesla_my_status'',''on'') %}Sleeping{% elif s==''home'' %}Home{% elif
            s==''not_home'' %}Away{% else %}{{ s|replace(''_'','' '')|title }}{% endif %}'
          icon: mdi:car-electric
          icon_color: '#dc969e'
          layout: horizontal
          fill_container: true
          multiline_secondary: true
          badge_icon: '{{ ''mdi:home'' if is_state(''device_tracker.parking_tesla_my_location'',''home'') and is_state(''binary_sensor.parking_tesla_my_status'',''on'')
            else ''mdi:map-marker-question-outline'' }}'
          badge_color: '{{ ''green'' if is_state(''device_tracker.parking_tesla_my_location'',''home'') and is_state(''binary_sensor.parking_tesla_my_status'',''on'')
            else ''grey'' }}'
          tap_action:
            action: navigate
            navigation_path: tesla
          card_mod:
            style: 'ha-card { background: linear-gradient(110deg, color-mix(in srgb, var(--card-background-color) 45%, transparent),
              transparent) !important; border: none !important; border-radius: 20px !important; box-shadow: none !important;
              }'
