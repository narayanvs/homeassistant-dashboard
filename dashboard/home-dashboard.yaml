- title: Rooms
  path: rooms
  icon: mdi:sofa-outline
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: custom:myhome-floating-nav-v23
      active: rooms
      grid_options:
        columns: full
        rows: auto
      dashboard: dashboard-mobile
      view: rooms
    - type: custom:myhome-room-console-v3
      rooms:
      - id: kitchen
        name: Kitchen
        group: Living spaces
        art: /local/myhome-room-icons-v1/kitchen.png
        photo: /local/myhome-rooms-v1/kitchen.png
        lights:
        - id: switch.kitchen_kitchen_1
          name: Kitchen 1
        - id: switch.kitchen_kitchen_2
          name: Kitchen 2
        - id: switch.dining_dining_1
          name: Dining 1
        - id: switch.dining_dining_2
          name: Dining 2
        - id: light.kitchen_corner
          name: Corner
        doors:
        - binary_sensor.kitchen_door_door_2
        power:
        - id: sensor.grillplats_plug_power
          above: 5
        - id: sensor.grillplats_plug_power_2
          above: 5
        - id: sensor.grillplats_plug_power_3
          above: 100
        temp: sensor.kitchen_temp_temperature
        humidity: sensor.kitchen_temp_humidity
        presence: binary_sensor.myhome_kitchen_area_presence
        last: input_datetime.kitchen_last_active
        today: sensor.kitchen_occupied_today
        sleep: input_boolean.kitchen_guest_sleeping
        script: script.kitchen_dining_toggle_sleep_mode_manually
        manual: input_boolean.kitchen_dining_sleep_manual_hold
        lux: sensor.kitchen_light_sensor_kitchen_kitchen_illuminance
        threshold: input_number.kitchen_automatic_lighting_lux_threshold
        cooldown: timer.kitchen_lighting_manual_off_cooldown
        history_entities:
        - binary_sensor.myhome_kitchen_lighting_presence
        - binary_sensor.myhome_dining_lighting_presence
        lux_zones:
        - name: Kitchen
          lux: sensor.kitchen_light_sensor_kitchen_kitchen_illuminance
          threshold: input_number.kitchen_automatic_lighting_lux_threshold
          cooldown: timer.kitchen_lighting_manual_off_cooldown
